services:
  - type: web
    name: srfood-api
    runtime: node
    repo: https://github.com/shubhamsingh325601/srfood-ecosystem
    branch: master
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    plan: free
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_VERSION
        value: v1
      - key: JWT_ACCESS_EXPIRY
        value: 1h
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: CORS_ALLOWED_ORIGINS
        value: https://frontend-gamma-two-9p3iz3sdpr.vercel.app
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX_PUBLIC
        value: "100"
      - key: RATE_LIMIT_MAX_AUTHENTICATED
        value: "300"
      - key: BCRYPT_SALT_ROUNDS
        value: "12"
      - key: SWAGGER_ENABLED
        value: "false"
      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
