services:
  - type: web
    name: srfood-api
    runtime: node
    repo: https://github.com/shubhamsingh325601/srfood-ecosystem
    branch: feature/merging-both-websites
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    plan: free
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_VERSION
        value: v1
      - key: APP_ID
        value: srfood
      - key: APP_ALLOWED_IDS
        value: srfood,shreeradhefood
      - key: APP_NAME
        value: SRFOOD
      - key: APP_TAGLINE
        value: Tasty Food, On Track
      - key: APP_DESCRIPTION
        value: Order hygienic, fresh meals delivered to your train seat. Safar ka saath, swaad ke saath.
      - key: APP_THEME
        value: orange
      - key: APP_SECRET
        generateValue: true
      - key: FEATURE_TRAINS
        value: "true"
      - key: FEATURE_STATIONS
        value: "true"
      - key: FEATURE_UPI_PAYMENTS
        value: "true"
      - key: FEATURE_FLOATING_CART_BAR
        value: "false"
      - key: MONGO_URI
        value: mongodb+srv://admin:strongPass123@cluster0.3op6yme.mongodb.net/srfood?retryWrites=true&w=majority&appName=Cluster0
      - key: MONGO_DB_NAME
        value: srfood
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 1h
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: CORS_ALLOWED_ORIGINS
        value: https://srfood-frontend.onrender.com,https://shreeradhefood-frontend.onrender.com
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX_PUBLIC
        value: "100"
      - key: RATE_LIMIT_MAX_AUTHENTICATED
        value: "300"
      - key: BCRYPT_SALT_ROUNDS
        value: "12"
      - key: SWAGGER_ENABLED
        value: "false"

  - type: web
    name: srfood-frontend
    runtime: static
    repo: https://github.com/shubhamsingh325601/srfood-ecosystem
    branch: feature/merging-both-websites
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://srfood-api.onrender.com/api/v1
      - key: VITE_APP_ID
        value: srfood
      - key: VITE_APP_NAME
        value: SRFOOD
      - key: VITE_APP_TAGLINE
        value: Tasty Food, On Track
      - key: VITE_APP_DESCRIPTION
        value: Order hygienic, fresh meals delivered to your train seat. Safar ka saath, swaad ke saath.
      - key: VITE_APP_OG_TITLE
        value: SRFOOD – Tasty Food, On Track
      - key: VITE_APP_OG_DESCRIPTION
        value: Order hygienic, fresh meals delivered to your train seat. Safar ka saath, swaad ke saath.
      - key: VITE_APP_FAVICON
        value: favicon.png
      - key: VITE_APP_THEME
        value: orange
      - key: VITE_FEATURE_TRAINS
        value: "true"
      - key: VITE_FEATURE_STATIONS
        value: "true"
      - key: VITE_FEATURE_UPI_PAYMENTS
        value: "true"
      - key: VITE_FEATURE_FLOATING_CART_BAR
        value: "true"

  - type: web
    name: shreeradhefood-frontend
    runtime: static
    repo: https://github.com/shubhamsingh325601/srfood-ecosystem
    branch: feature/merging-both-websites
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://srfood-api.onrender.com/api/v1
      - key: VITE_APP_ID
        value: shreeradhefood
      - key: VITE_APP_NAME
        value: Shree Radhe Foods
      - key: VITE_APP_TAGLINE
        value: Tasty Food, Delivered
      - key: VITE_APP_DESCRIPTION
        value: Order hygienic, fresh meals delivered fast in Kota & Sawai Madhopur.
      - key: VITE_APP_OG_TITLE
        value: Shree Radhe Foods – Tasty Food, Delivered
      - key: VITE_APP_OG_DESCRIPTION
        value: Order hygienic, fresh meals delivered fast in Kota & Sawai Madhopur.
      - key: VITE_APP_FAVICON
        value: favicon.jpg
      - key: VITE_APP_SERVICE_AREA
        value: Kota & Sawai Madhopur
      - key: VITE_APP_THEME
        value: red
      - key: VITE_FEATURE_TRAINS
        value: "false"
      - key: VITE_FEATURE_STATIONS
        value: "false"
      - key: VITE_FEATURE_UPI_PAYMENTS
        value: "true"
      - key: VITE_FEATURE_FLOATING_CART_BAR
        value: "true"
