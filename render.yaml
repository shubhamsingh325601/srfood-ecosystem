services:
  - type: web
    name: srfood-api
    runtime: node
    repo: https://github.com/shubhamsingh325601/srfood-ecosystem
    branch: master
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    plan: free
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_VERSION
        value: v1
      - key: JWT_ACCESS_EXPIRY
        value: 1h
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: CORS_ALLOWED_ORIGINS
        value: https://srfood-frontend.onrender.com,https://shree-radhe-foods.onrender.com
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX_PUBLIC
        value: "100"
      - key: RATE_LIMIT_MAX_AUTHENTICATED
        value: "300"
      - key: BCRYPT_SALT_ROUNDS
        value: "12"
      - key: SWAGGER_ENABLED
        value: "false"
      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false

  - type: web
    name: srfood-frontend
    runtime: static
    repo: https://github.com/shubhamsingh325601/srfood-ecosystem
    branch: master
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://srfood-api-sz99.onrender.com/api/v1

  - type: web
    name: shree-radhe-foods
    runtime: static
    repo: https://github.com/shubhamsingh325601/srfood-ecosystem
    branch: Shree-Radhee-Foods
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://srfood-api-sz99.onrender.com/api/v1